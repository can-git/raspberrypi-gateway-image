# Explicit project name -> the dbus volume is created as "nu_dbus-volume",
# which is what nuSinkConfigurator.service references.
name: nu

volumes:
    dbus-volume:

services:
  dbus-service:
    image: wirepas/gateway_dbus_service:${GATEWAY_TAG:-latest}
    container_name: dbus
    restart: always
    volumes:
      - type: volume
        source: dbus-volume
        target: /var/run/dbus
    logging:
      driver: journald

  # Remote transport -> Wirepas backend. KEPT on purpose (KARAR 2026-07-21):
  # it carries gateway/mesh diagnostics to the Wirepas backend server. Telemetry
  # to the Nu platform does NOT flow through here — that is nu-gateway's job.
  transport-service:
    image: wirepas/gateway_transport_service:${GATEWAY_TAG:-latest}
    container_name: transport-service
    environment:
      WM_GW_ID: ${WM_GW_ID}
      WM_GW_MODEL: NuRpiGwDocker
      WM_GW_VERSION: ${GATEWAY_TAG:-latest}
      WM_SERVICES_MQTT_HOSTNAME: ${WM_SERVICES_MQTT_HOSTNAME}
      WM_SERVICES_MQTT_PORT: ${WM_SERVICES_MQTT_PORT}
      WM_SERVICES_MQTT_USERNAME: ${WM_SERVICES_MQTT_USERNAME}
      WM_SERVICES_MQTT_PASSWORD: ${WM_SERVICES_MQTT_PASSWORD}
      WM_SERVICES_MQTT_FORCE_UNSECURE: ${WM_SERVICES_MQTT_FORCE_UNSECURE}
    restart: always
    depends_on:
      - dbus-service
    volumes:
      - type: volume
        source: dbus-volume
        target: /var/run/dbus
    logging:
      driver: journald

  # Local transport -> host mosquitto. This is nu-gateway's data source.
  # WM_GW_ID must be the PLAIN id (no suffix): nu-gateway validates the gateway
  # segment of the local gw-event topics against gateway.json and drops
  # anything that doesn't match its own id.
  transport-service-local:
    image: wirepas/gateway_transport_service:${GATEWAY_TAG:-latest}
    container_name: transport-service-local
    network_mode: host
    environment:
      WM_GW_ID: ${WM_GW_ID}
      WM_GW_MODEL: "NuRpiGwDocker"
      WM_GW_VERSION: ${GATEWAY_TAG:-latest}
      WM_SERVICES_MQTT_HOSTNAME: "localhost"
      WM_SERVICES_MQTT_PORT: 1883
      WM_SERVICES_MQTT_USERNAME:
      WM_SERVICES_MQTT_PASSWORD:
      WM_SERVICES_MQTT_FORCE_UNSECURE: "True"
    restart: always
    depends_on:
      - dbus-service
    volumes:
      - type: volume
        source: dbus-volume
        target: /var/run/dbus
    logging:
      driver: journald

  sink-service:
    image: wirepas/gateway_sink_service:${GATEWAY_TAG:-latest}
    container_name: sink-service
    restart: always
    depends_on:
      - dbus-service
    devices:
      - ${WM_GW_SINK_UART_PORT}:/dev/mysink
    environment:
      WM_GW_SINK_BAUDRATE: ${WM_GW_SINK_BITRATE}
      WM_GW_SINK_ID: 1
      WM_GW_SINK_UART_PORT: /dev/mysink
    volumes:
      - type: volume
        source: dbus-volume
        target: /var/run/dbus
    logging:
      driver: journald

  # Nu telemetry gateway (nugw): local mosquitto gw-event -> parse/convert ->
  # TBMQ over mutual TLS. Image is preloaded from nugw.tar by
  # nuGatewayUpdate.service on first boot (no registry involved).
  # Unprovisioned devices have no gateway.json yet: nugw exits and restart:always
  # backs off until provisioning delivers one — expected STOCK behavior.
  nu-gateway:
    image: nugw:latest
    container_name: nu-gateway
    network_mode: host
    restart: always
    environment:
      NU_CONFIG: /boot/firmware/nu/gateway.json
    volumes:
      - /boot/firmware/nu:/boot/firmware/nu:ro    # runtime config (gateway.json/.env)
      - /etc/nu/certs:/etc/nu/certs:ro            # mutual-TLS client cert (per customer)
      - /var/lib/nu:/var/lib/nu                   # rw: counters + publish queue + last-good
    logging:
      driver: journald
