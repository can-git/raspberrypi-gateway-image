# Builds the "nu" golden gateway image with pi-gen on a native arm64 runner.
#
# Required repo secrets:
#   WIFI_SSID / WIFI_PSK      - default WiFi baked into the image
#   FIRST_USER_PASS           - password of the "nu" user (not committed)
#   BOOTSTRAP_DEVICE_KEY      - raspi-provision private key (PEM)
#   BITBUCKET_TOKEN           - Atlassian API token (Bitbucket app, read:repository
#                               scope) to clone nu-gateway-service. Alternative:
#                               NUGW_CLONE_URL = full clone URL WITH credentials
#                               embedded (username alone does not work on a runner).

name: Build Full Rpi image from scratch

on:
  workflow_dispatch:

  release:
    types: [created]

jobs:
  build_image:
    strategy:
      matrix:
        architecture: [arm64]
        include:
          - architecture: arm64
            pi-gen-tag: 2025-10-01-raspios-trixie-arm64
            # Standard amd64 runner + QEMU: the free arm64 runners are
            # public-repo-only and this repo must stay PRIVATE (the image
            # embeds WiFi creds, the user password and the bootstrap key).
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: checkout our repo
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation for pi-gen + nugw build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: checkout pi-gen
        uses: actions/checkout@v4
        with:
          repository: 'RPi-Distro/pi-gen'
          ref: ${{ matrix.pi-gen-tag }}
          path: 'pi-gen'

      - name: clone nu-gateway-service (Bitbucket)
        env:
          NUGW_CLONE_URL: ${{ secrets.NUGW_CLONE_URL }}
          BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
        run: |
          # Preferred: BITBUCKET_TOKEN = Atlassian API token (Bitbucket app,
          # read:repository scope) — the fixed clone URL is built here.
          # NUGW_CLONE_URL (full URL WITH credentials embedded) still wins if set
          # to a value that actually contains a secret.
          if [ -n "${BITBUCKET_TOKEN}" ]; then
            git clone --depth 1 "https://x-bitbucket-api-token-auth:${BITBUCKET_TOKEN}@bitbucket.org/nutechnologysoftware/nu-gateway-service.git" nu-gateway-service
          elif [ -n "${NUGW_CLONE_URL}" ]; then
            git clone --depth 1 "${NUGW_CLONE_URL}" nu-gateway-service
          else
            echo "ERROR: set the BITBUCKET_TOKEN secret (Atlassian API token, read:repository)" >&2
            exit 1
          fi

      - name: Build nugw container image and freeze it into the step
        run: |
          docker build --platform linux/arm64 -t nugw:latest -f nu-gateway-service/docker/Dockerfile nu-gateway-service
          docker save -o step/06-gateway-service/files/nugw.tar nugw:latest
          ls -lh step/06-gateway-service/files/nugw.tar

      - name: Materialize nu-provision source into the step
        run: |
          cp -r nu-gateway-service/provision step/10-nu-provision/files/provision
          rm -rf step/10-nu-provision/files/provision/tests \
                 step/10-nu-provision/files/provision/__pycache__ \
                 step/10-nu-provision/files/provision/.pytest_cache

      - name: Materialize build secrets (gitignored files)
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PSK: ${{ secrets.WIFI_PSK }}
          BOOTSTRAP_DEVICE_KEY: ${{ secrets.BOOTSTRAP_DEVICE_KEY }}
          FIRST_USER_PASS: ${{ secrets.FIRST_USER_PASS }}
        run: |
          {
            echo "WIFI_SSID=${WIFI_SSID}"
            echo "WIFI_PSK=${WIFI_PSK}"
          } > step/07-network/wifi.env
          printf '%s' "${BOOTSTRAP_DEVICE_KEY}" > step/08-default-cert/files/device-key.pem
          echo "FIRST_USER_PASS='${FIRST_USER_PASS}'" >> config

      - name: Copy our own sub step
        run: |
          cp -r step/* pi-gen/stage2/

      - name: copy config
        run: |
           cp config pi-gen/

      - name: run script to build gateway image
        run: ./build-docker.sh
        working-directory: pi-gen

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nu_gateway-${{ matrix.architecture }}
          path: pi-gen/deploy/image*

      - name: Get release
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifacts before release
        if: github.event_name == 'release'
        working-directory: pi-gen/deploy
        run: |
          sudo mv *-lite.zip nu_gateway_${{ github.event.release.tag_name }}-${{ matrix.architecture }}-lite.zip

      - name: Upload Lite image
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
           upload_url: ${{ steps.get_release.outputs.upload_url }}
           asset_path: "pi-gen/deploy/nu_gateway_${{ github.event.release.tag_name }}-${{ matrix.architecture }}-lite.zip"
           asset_name: "nu_gateway_${{ github.event.release.tag_name }}-${{ matrix.architecture }}-lite.zip"
           asset_content_type: application/zip
